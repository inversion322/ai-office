<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login hidden">
  <form id="loginForm">
    <div class="login-duck" id="loginDuck"></div>
    <h1>AI Office</h1>
    <p>Адрес API и токен хранятся только в вашем браузере</p>
    <input id="apiUrl" placeholder="https://….trycloudflare.com" autocomplete="off" required>
    <input id="apiToken" type="password" placeholder="Токен доступа" autocomplete="off" required>
    <button type="submit">Войти</button>
    <div id="loginErr" class="err" role="alert"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <main class="main">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>AI Office</div>
      <div id="conn" class="conn off">нет связи</div>
      <div class="spacer"></div>
      <div id="clock" class="clock"></div>
      <button id="logout" class="btn-ghost">Выйти</button>
    </header>

    <section class="floor-wrap">
      <div class="floor" id="floor">
        <canvas id="cvBack" width="320" height="180"></canvas>
        <div class="wall"><div class="board" id="funnel"></div></div>
        <div id="desks"></div>
        <div id="actors"></div>
        <canvas id="cvFront" width="320" height="180"></canvas>
        <div id="bubbles"></div>
      </div>
    </section>

    <section class="bottom">
      <div class="panel"><h3>Запланировано</h3><ul id="tasks"></ul></div>
      <div class="panel"><h3>Вакансии</h3><ul id="jobs"></ul></div>
      <div class="panel"><h3>Журнал</h3><ul id="events" class="log"></ul></div>
    </section>
  </main>

  <aside class="side">
    <div class="stats">
      <div><b id="sTotal">0</b><span>Сотрудников</span></div>
      <div><b id="sActive" class="ok">0</b><span>В работе</span></div>
      <div><b id="sWait" class="warn">0</b><span>Ждут вас</span></div>
    </div>
    <ul id="agentList" class="agents"></ul>
    <div id="detail" class="detail hidden"></div>
    <div class="hint">Нажмите на сотрудника, чтобы увидеть детали</div>
  </aside>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal-card">
    <div class="m-head"><div id="mAvatar" class="av big"></div><div><h2 id="mTitle"></h2><div id="mSub" class="m-sub"></div></div>
      <button id="mClose" class="btn-ghost" aria-label="Закрыть">✕</button></div>
    <div class="m-body">
      <section>
        <label for="mPrompt" class="lbl">Системный промпт</label>
        <textarea id="mPrompt" rows="11" spellcheck="false"></textarea>
        <div class="m-row"><span id="mVer" class="m-sub"></span><span class="spacer"></span>
          <button id="mSave" class="btn-primary">Сохранить</button></div>
        <div id="mMsg" class="m-msg" role="status"></div>
        <details><summary>История версий</summary><ul id="mHist" class="hist"></ul></details>
      </section>
      <section>
        <div class="lbl">Навыки</div>
        <div id="mSkills" class="skills"></div>
        <div class="m-row"><span class="spacer"></span><button id="mSaveSkills" class="btn-primary">Сохранить навыки</button></div>
      </section>
    </div>
  </div>
</div>

<script src="duck.js"></script>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
